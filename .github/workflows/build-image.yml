name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --omit=optional --ignore-scripts
      - name: Portable SQLite and WebAssembly upload regressions
        run: npm test
        env:
          NAV_SQLITE_DRIVER: builtin
  build:
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build security test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nav-item-security-test:local
          cache-from: type=gha

      - name: Security regression tests
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" --entrypoint node nav-item-security-test:local --test /app/tests/security.test.js

      - name: Built-in SQLite regression tests
        run: docker run --rm -e NAV_SQLITE_DRIVER=builtin -v "$PWD/tests:/app/tests:ro" --entrypoint node nav-item-security-test:local --test /app/tests/security.test.js

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish both architectures
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name == 'main' && 'latest' || github.ref_type == 'tag' && github.ref_name || 'test' }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published platforms and application startup
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --raw > manifest.json
          for arch in amd64 arm64; do
            jq -e --arg arch "$arch" 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == $arch)' manifest.json
            digest=$(jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' manifest.json)
            docker run -d --platform "linux/$arch" --name nav-smoke -e ADMIN_PASSWORD=Smoke-test-only-Password2026 -e JWT_SECRET=Smoke-test-only-secret-32-bytes-minimum -p 127.0.0.1:3000:3000 "${IMAGE%@*}@$digest"
            ready=false
            for attempt in $(seq 1 60); do
              if curl -fsS http://localhost:3000/ >/dev/null && curl -fsS http://localhost:3000/api/menus >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            docker logs nav-smoke
            docker rm -f nav-smoke
            test "$ready" = true
          done
