services:
  nav-item:
    image: ghcr.io/frbico/nav-item:latest
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - nav-database:/app/database
      - nav-uploads:/app/uploads
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  nav-database:
  nav-uploads:
